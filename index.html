<script>
window.__fatal = function (msg) {
  var d = document.getElementById('err'); if (!d) return;
  d.style.display = 'block';
  d.innerHTML = '<div style="max-width:560px;margin:8vh auto"><div style="font-size:22px;margin-bottom:12px">Игра не смогла запуститься</div><div style="opacity:.85;font-size:15px;word-break:break-word">' + String(msg).replace(/[<>&]/g, '') + '</div><div style="margin-top:16px;opacity:.7;font-size:14px">Обновите страницу. Если не помогло — пришлите этот текст, по нему найду причину.</div></div>';
};
window.addEventListener('error', function (e) { if (!window.__started) window.__fatal((e.message || 'ошибка') + ' (' + String(e.filename || '').split('/').pop() + ':' + (e.lineno || '?') + ')'); });
</script>
<style>
  html, body { margin: 0; height: 100%; background: #07050c; display: flex; align-items: center; justify-content: center; overflow: hidden;
    touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
  @supports (height: 100dvh) { html, body { height: 100dvh; } }
  #rot { display: none; position: fixed; top: calc(env(safe-area-inset-top, 0px) + 10px); left: 50%; transform: translateX(-50%); z-index: 20; pointer-events: none; padding: 9px 18px; border-radius: 20px;
    background: rgba(10,6,18,0.88); border: 1px solid rgba(201,162,74,0.6); color: #f3ead0; font: italic 15px Georgia, serif; white-space: nowrap; }
  @media (orientation: portrait) { #rot { display: block; } }
  canvas { width: min(100vw, calc(100vh * 16 / 9)); aspect-ratio: 16 / 9; display: block; touch-action: none; }

  /* ---- сенсорное управление (iPad / телефоны) ---- */
  #touch { display: none; position: fixed; inset: 0; pointer-events: none; z-index: 10; --s: clamp(72px, 12vmin, 124px); --sr: clamp(90px, 14.8vmin, 152px);
    font-family: Georgia, serif; color: #f3ead0; }
  #touch.on { display: block; }
  #touch > * { position: absolute; pointer-events: auto; touch-action: none; -webkit-user-select: none; user-select: none; }
  .tb, .arr { display: flex; align-items: center; justify-content: center; box-sizing: border-box; border-radius: 50%;
    background: rgba(52, 40, 66, 0.55); border: 2px solid rgba(201, 162, 74, 0.7); box-shadow: inset 0 0 0 3px rgba(0, 0, 0, 0.28);
    text-shadow: 0 1px 4px #000; transition: background .06s, transform .06s; }
  .tb { flex-direction: column; font-size: calc(var(--s) * 0.15); letter-spacing: 1px; font-weight: 600; }
  .tb.down, .arr.down { background: rgba(255, 205, 120, 0.55); border-color: rgba(255, 233, 176, 0.9); transform: scale(0.93); }
  /* иконки кнопок: векторные, в стиле героя — толстый тёмный контур, плоские заливки */
  .ic { display: block; width: calc(var(--s) * 0.46); height: calc(var(--s) * 0.46); pointer-events: none; overflow: visible;
    filter: drop-shadow(0 0 1.2px rgba(243, 234, 208, 0.95)) drop-shadow(0 0 1px rgba(243, 234, 208, 0.7)) drop-shadow(0 2px 2px rgba(0, 0, 0, 0.55)); }
  .down .ic { filter: brightness(1.15) drop-shadow(0 0 1.2px rgba(243, 234, 208, 0.95)) drop-shadow(0 2px 2px rgba(0, 0, 0, 0.55)); }
  .arr .ic { width: 58%; height: 58%; }
  #aR .ic { transform: scaleX(-1); }
  #bJump .ic { width: calc(var(--sr) * 0.7); height: calc(var(--sr) * 0.7); }
  #bAtk .ic { width: calc(var(--sr) * 0.66); height: calc(var(--sr) * 0.66); }
  #bDash .ic, #bOrb .ic { width: calc(var(--sr) * 0.6); height: calc(var(--sr) * 0.6); }
  .icw { position: relative; display: block; }
  .icw .ic { position: absolute; inset: 0; width: 100%; height: 100%; }
  .icw .sl { display: none; }
  .off .icw .sl { display: block; }
  .off .icw .ic:first-child { opacity: 0.6; }
  #dpad { left: calc(env(safe-area-inset-left, 0px) + 28px); bottom: calc(env(safe-area-inset-bottom, 0px) + 28px);
    width: calc(var(--s) * 2.5); height: calc(var(--s) * 1.15); display: flex; justify-content: space-between; align-items: center; }
  .arr { width: calc(var(--s) * 1.15); height: calc(var(--s) * 1.15); font-size: calc(var(--s) * 0.5); pointer-events: none; }
  #bJump { width: calc(var(--sr) * 1.25); height: calc(var(--sr) * 1.25); right: calc(env(safe-area-inset-right, 0px) + 28px); bottom: calc(env(safe-area-inset-bottom, 0px) + 28px); }
  #bAtk { width: var(--sr); height: var(--sr); right: calc(env(safe-area-inset-right, 0px) + 28px + var(--sr) * 1.25 + 20px); bottom: calc(env(safe-area-inset-bottom, 0px) + 28px); }
  #bDash { width: calc(var(--sr) * 0.9); height: calc(var(--sr) * 0.9); right: calc(env(safe-area-inset-right, 0px) + 38px); bottom: calc(env(safe-area-inset-bottom, 0px) + 28px + var(--sr) * 1.25 + 18px); }
  #bOrb { width: calc(var(--sr) * 0.9); height: calc(var(--sr) * 0.9); right: calc(env(safe-area-inset-right, 0px) + 28px + var(--sr) * 1.25 + 20px); bottom: calc(env(safe-area-inset-bottom, 0px) + 28px + var(--sr) + 18px); }
  #bMap { width: 52px; height: 52px; border-radius: 50%; right: calc(env(safe-area-inset-right, 0px) + 80px); top: calc(env(safe-area-inset-top, 0px) + 12px); font-size: 10px; letter-spacing: 1.5px; background: rgba(23,16,10,.45); }
  #bMap .ic { width: 32px; height: 32px; }
  #bTalk { width: 96px; height: 62px; border-radius: 31px; left: 50%; margin-left: -48px; bottom: calc(env(safe-area-inset-bottom, 0px) + 28px); font-size: 16px; flex-direction: row; gap: 10px; background: rgba(255,205,120,.38); border-color: rgba(255,233,176,.85); }
  #bMute { width: 52px; height: 52px; right: calc(env(safe-area-inset-right, 0px) + 16px); top: calc(env(safe-area-inset-top, 0px) + 12px); background: rgba(23,16,10,.45); }
  #bMute .icw { width: 36px; height: 36px; }
  #bTalk .ic { width: 40px; height: 40px; }
</style>

<script>

function rng(seed) {

// ====================== Звук и музыка ======================
const BPM = 72, BEAT = 60 / BPM, STEP_T = BEAT / 2;
let AC = null, master = null, musicGain = null, ambientGain = null, calmT = null, bossT = null, clockT = null, hallT = null, towerT = null, curMode = 'calm', noiseBuf = null, muted = false, nextT = 0, stepN = 0;
const NOTE = {D4: 293.66, E4: 329.63, F4: 349.23, G4: 392, A4: 440, Bb4: 466.16, C5: 523.25, Cs5: 554.37, D5: 587.33, E5: 659.25, F5: 698.46};
const CHORDS = [
  {root: 73.42, tones: [146.83, 174.61, 220]},    // Dm
  {root: 58.27, tones: [116.54, 146.83, 174.61]}, // Bb

  {root: 55.0,  tones: [110, 138.59, 164.81]}     // A

const MEL = [
  'A4 - - - F4 - - - G4 - A4 - D5 - - -',
  'D5 - - - C5 - Bb4 - A4 - - - F4 - - -',
  'Bb4 - - - D5 - C5 - Bb4 - - - G4 - A4 -',
  'Cs5 - - - E5 - D5 - Cs5 - - - A4 - - -'

const PAT = [0, 2, 4, 5, 4, 2, 3, 1];

function ac() {

    try {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      const comp = AC.createDynamicsCompressor(); comp.connect(AC.destination);
      master = AC.createGain(); master.gain.value = 0.9; master.connect(comp);
      musicGain = AC.createGain(); musicGain.gain.value = muted ? 0 : 0.9; musicGain.connect(master);
      const len = Math.floor(AC.sampleRate * 3), ir = AC.createBuffer(2, len, AC.sampleRate);
      for (let ch = 0; ch < 2; ch++) { const d = ir.getChannelData(ch); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.6); }
      const reverb = AC.createConvolver(); reverb.buffer = ir;
      const rg = AC.createGain(); rg.gain.value = 0.5; reverb.connect(rg); rg.connect(musicGain);

        const delayIn = AC.createGain(), dl = AC.createDelay(2), fb = AC.createGain(), lp = AC.createBiquadFilter();

      const nb = AC.createBuffer(1, AC.sampleRate * 4, AC.sampleRate), nd = nb.getChannelData(0);

  g.gain.setValueAtTime(0.0001, t0); g.gain.linearRampToValueAtTime(vol, t0 + att);

function playStep(n, t) {
  const bar = Math.floor(n / 16) % 4, s = n % 16, cyc = Math.floor(n / 64) % 2, ch = CHORDS[bar], C = calmT;
  if (s === 0) ch.tones.forEach(f => {

    voice('sawtooth', f, t, 1.4, 3.6, 16 * STEP_T + 1.4, 0.02, [C.bus], 7, 520);
  });

    voice('sine', ch.root, t, 0.03, 0, 1.8, 0.17, [C.out]);

// ---- Отдельный боевой трек: быстрый, ритмичный, в ми миноре ----
const BPM_B = 138, BB = 60 / BPM_B, BSTEP = BB / 4;
const BCH = [
  {root: 82.41, tones: [164.81, 196, 246.94]},  // Em
  {root: 82.41, tones: [164.81, 196, 246.94]},  // Em
  {root: 65.41, tones: [130.81, 164.81, 196]},  // C
  {root: 61.74, tones: [123.47, 155.56, 185]}   // B
];
const BN = {E5: 659.25, B4: 493.88, D5: 587.33, G5: 784, G4: 392, A4: 440, C5: 523.25, Ds5: 622.25, Fs4: 369.99};
const BLEAD = [
  'E5 - - B4 - D5 - E5 - - G5 - E5 - D5 -',
  'B4 - - G4 - A4 - B4 - - D5 - B4 - A4 -',
  'C5 - - G4 - B4 - C5 - - E5 - C5 - B4 -',
  'Ds5 - - B4 - A4 - Fs4 - - A4 - B4 - Ds5 -'

const bossStepDur = () => BSTEP * (boss && boss.rage ? 0.93 : 1);
function playBossStep(n, t) {
  const rage = !!(boss && boss.rage), bar = Math.floor(n / 16) % 4, s = n % 16, ch = BCH[bar], T = bossT, d = BSTEP;
  // ударные
  if (s % 4 === 0) boom(t, s === 0 ? 0.34 : 0.26, T.out);
  if (rage && s === 14) boom(t, 0.2, T.out);

    voice('square', lf / 2, t, 0.01, 0, d * 3, 0.02, [T.bus], 0, 1200);

// ---- Боевой трек Часовщика: заводной механизм, ре минор (в тон Часовой башни), 126 уд/мин ----
const BPM_C = 126, CB = 60 / BPM_C, CSTEP = CB / 4;
const CCH = [
  {root: 73.42, tones: [146.83, 174.61, 220]},    // Dm
  {root: 58.27, tones: [116.54, 146.83, 174.61]}, // Bb
  {root: 49.0,  tones: [98, 116.54, 146.83]},     // Gm
  {root: 55.0,  tones: [110, 138.59, 164.81]}     // A

const CN = {G4: 392, A4: 440, Bb4: 466.16, C5: 523.25, Cs5: 554.37, D5: 587.33, E5: 659.25, F5: 698.46, G5: 784, A5: 880};

  'D5 - A4 - D5 - F5 - A5 - F5 - E5 - D5 -',
  'Bb4 - D5 - F5 - D5 - Bb4 - D5 - C5 - Bb4 -',

const clockStepDur = () => CSTEP * (boss && boss.phase2 ? 0.93 : 1);

  if (p.g) {
    for (let y = top + 20; y < top + depth; y += 22) pts.push([pad + w + (r() * 8 - 4), y]);
    pts.push([pad + w, top + depth], [pad, top + depth]);
    for (let y = top + depth - 20; y > top; y -= 22) pts.push([pad + (r() * 8 - 4), y]);
  } else {
    const n = Math.max(4, Math.round(w / 16));
    for (let i = 0; i <= n; i++) {
      const u = 1 - i / n, s = Math.pow(Math.sin(Math.PI * Math.min(0.999, Math.max(0.001, u))), 0.55);

    }
  }

  path();
  const gr = g.createLinearGradient(0, top, 0, top + depth + (p.g ? 0 : 60));
  if (theme === 'hall') { gr.addColorStop(0, '#2a3466'); gr.addColorStop(0.5, '#141a3c'); gr.addColorStop(1, '#05071a'); } else { gr.addColorStop(0, '#2f2b4a'); gr.addColorStop(0.5, '#1a1628'); gr.addColorStop(1, '#07050c'); }
  g.fillStyle = gr; g.fill();
  g.save(); path(); g.clip();
  const pal = theme === 'hall' ? ['#33407a', '#2b3768', '#3a4884', '#26305c'] : ['#3d3860', '#363152', '#44406a', '#2f2b48'];
  const rows = Math.ceil((depth + 60) / 17);

  ctx.fillStyle = brass; ctx.fillRect(-27, 6, 54, 10); ctx.strokeRect(-27, 6, 54, 10); ctx.fillStyle = 'rgba(255,230,160,0.9)'; ctx.fillRect(-7, 7, 14, 8);

}

// ---------- НПС Тик: часы-будильник ----------
function drawTick(n, t, near, talking, speak) {
  const x = n.x, y = n.y, face = P.x + P.w / 2 < x ? -1 : 1, sn = Math.sin, bob = sn(t * 0.05 + x) * 1.2, hello = near || talking;
  const wig = (speak ? sn(t * 0.5) * 0.3 : sn(t * 0.04) * 0.07) + (hello ? 0.12 : 0);
  ctx.save(); ctx.globalAlpha = 0.35; ctx.fillStyle = '#000'; ctx.beginPath(); ctx.ellipse(x, y + 1, 24, 4.5, 0, 0, 7); ctx.fill(); ctx.restore();
  ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = 0.26 + 0.06 * sn(t * 0.05); ctx.drawImage(glowWarm, x - 85, y - 125, 170, 170); ctx.restore();
  ctx.save(); ctx.translate(x, y); ctx.scale(face, 1); ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.strokeStyle = C_OUT; ctx.lineWidth = 2.6;
  [-14, 5].forEach((lx, i) => { ctx.fillStyle = i ? '#8a5a2a' : '#9a6a30'; rrect(lx, -14, 10, 14, 3); ctx.fill(); ctx.stroke(); });
  ctx.translate(0, -37 + bob);
  ctx.fillStyle = '#6d4aa6';   // ручки
  rrect(-35, -4, 10, 22, 4); ctx.fill(); ctx.stroke();
  ctx.save(); ctx.translate(26, -2); ctx.rotate(hello ? -2.2 + sn(t * 0.22) * 0.3 : -0.1); rrect(-5, 0, 10, 22, 4); ctx.fill(); ctx.stroke(); ctx.restore();
  [-1, 1].forEach(s => {        // колокольчики-ушки
    ctx.save(); ctx.translate(s * 17, -24); ctx.rotate(s * 0.55 + wig * s);
    ctx.fillStyle = BRASS_D; rrect(-2, -2, 4, 8, 1); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.arc(0, -4, 10, Math.PI, 0); ctx.closePath(); ctx.fillStyle = BRASS; ctx.fill(); ctx.stroke();
    ctx.restore(); });
  ctx.beginPath(); ctx.arc(0, 0, 28, 0, 7); ctx.fillStyle = BRASS; ctx.fill(); ctx.stroke();                 // корпус
  ctx.beginPath(); ctx.arc(0, 0, 23.5, 0, 7); ctx.fillStyle = '#6d4aa6'; ctx.fill(); ctx.lineWidth = 2; ctx.stroke();
  ctx.beginPath(); ctx.arc(2, 0, 18, 0, 7); ctx.fillStyle = CREAM; ctx.fill(); ctx.lineWidth = 2; ctx.stroke();      // циферблат-лицо
  ctx.strokeStyle = '#4a2810'; ctx.lineWidth = 1.5; for (let i = 0; i < 12; i++) { const a = i / 12 * 6.283; ctx.beginPath(); ctx.moveTo(2 + Math.cos(a) * 15, Math.sin(a) * 15); ctx.lineTo(2 + Math.cos(a) * 17, Math.sin(a) * 17); ctx.stroke(); }

  ctx.restore();
}

// ---------- музыка башни: механические щелчки, трещотки, гул и редкий колокол ----------
const TCH = [{root: 73.42, tones: [146.83, 174.61, 220, 293.66]}, {root: 58.27, tones: [116.54, 146.83, 174.61, 233.08]}, {root: 49, tones: [98, 116.54, 146.83, 196]}, {root: 55, tones: [110, 138.59, 164.81, 220]}];
const TN = {D5: 587.33, A4: 440, F5: 698.46, E5: 659.25, Bb4: 466.16, G4: 392, C5: 523.25, Cs5: 554.37, A5: 880, G5: 784, F4: 349.23, D4: 293.66};
const TMEL = ['D5 - A4 - F5 - E5 -', 'D5 - Bb4 - F5 - D5 -', 'Bb4 - G4 - D5 - C5 -', 'Cs5 - E5 - A5 - G5 -'].map(s => s.split(' ').map(n => n === '-' ? 0 : TN[n]));
function playTowerStep(n, t) {
  const bar = Math.floor(n / 16) % 4, s = n % 16, ch = TCH[bar], T = towerT, d = TOWER_STEP;
  // Механический ход: сухие металлические щелчки вместо шумового «тика»
  if (s % 2 === 0) {
    const big = s % 4 === 0, hi = big ? 2600 : 1900;
    voice('square', hi, t, 0.001, 0, 0.018, big ? 0.02 : 0.013, [T.out], 0, 6500);
    voice('sine', hi * 0.42, t, 0.001, 0, 0.05, 0.012, [T.out]);
    if (big) voice('sine', 88, t, 0.002, 0, 0.1, 0.03, [T.out]);
  }
  // Трещотка шестерни: три быстрых зуба
  if (s === 6 || s === 14) {
    for (let i = 0; i < 3; i++) {
      const tt = t + i * d * 0.13;
      voice('square', 1650 - i * 190, tt, 0.001, 0, 0.016, 0.011, [T.out], 0, 5200);
      voice('triangle', 420 - i * 55, tt, 0.001, 0, 0.028, 0.007, [T.out], 0, 1100);
    }
  }
  // Раз в такт: низкий гул механизма, аккорд и редкий колокол
  if (s === 0) {
    voice('sawtooth', ch.root, t, 0.9, 2, d * 16 + 0.8, 0.028, [T.bus], -7, 240);
    voice('sawtooth', ch.root, t, 0.9, 2, d * 16 + 0.8, 0.02, [T.bus], 7, 240);
    voice('triangle', ch.root * 2, t, 0.9, 2, d * 16 + 0.8, 0.016, [T.bus], 0, 600);
    voice('sine', ch.root, t, 0.2, 0, d * 16, 0.1, [T.out]);
    ch.tones.forEach((f, i) => voice('triangle', f, t, 1.6, 3, d * 16 + 1, 0.014, [T.bus], (i - 1.5) * 5, 900));
    if (bar % 2 === 0) [1, 2.76, 5.4].forEach((k, i) => voice('sine', ch.root * 4 * k, t, 0.005, 0, 4 - i, 0.05 / (i + 1), [T.bus, T.delayIn]));
  }
  // Заводная пружина: короткий скрип во второй половине такта
  if (s === 8) for (let i = 0; i < 5; i++) voice('sawtooth', 220 + i * 55, t + i * 0.055, 0.001, 0, 0.05, 0.006, [T.out], 0, 1200);
  const mf = s % 2 === 0 ? TMEL[bar][s >> 1] : 0;
  if (mf) { voice('triangle', mf, t, 0.005, 0, 1.5, 0.055, [T.bus, T.delayIn]); voice('sine', mf * 2, t, 0.005, 0, 0.8, 0.014, [T.bus]); }
}

// ====================== Запуск ======================
const STEP = 1000 / 60;
let last = performance.now(), acc = 0;
let loopFails = 0;
function loop(now) {
  requestAnimationFrame(loop);
  try {
    acc += Math.min(now - last, 100); last = now;
    while (acc >= STEP) { update(); acc -= STEP; }
    draw();
    window.__started = true; loopFails = 0;
  } catch (e) {
    acc = 0; last = now;
    if (++loopFails === 1) { try { console.error(e); } catch (_) {} }

  }
}
